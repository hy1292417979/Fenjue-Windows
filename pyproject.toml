[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fenjue-engine"
version = "0.3.0"
description = "Private original Responses gateway and same-account pathway research toolkit"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "anyio==4.11.0", "PyJWT[crypto]==2.10.1", "websockets==15.0.1"]

[project.optional-dependencies]
legacy-gateway = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
service = ["fastapi==0.115.12", "uvicorn==0.34.3"]

[project.scripts]
fenjue = "fenjue.__main__:main"
fenjue-research = "fenjue.research.__main__:main"
fenjue-discovery = "fenjue.discovery.__main__:main"
fenjue-serve = "fenjue.service:main"
fenjue-operator = "fenjue.operator:main"

[tool.setuptools.packages.find]
include = ["fenjue*"]

[tool.setuptools.package-data]
fenjue = ["service.html", "cockpit.html"]
